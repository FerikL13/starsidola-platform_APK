# STARS IDOLA — AMBIL CADANGAN KUNCI APK (sekali pakai)
# Mengambil kembali kunci rilis APK dari secret repo ini menjadi file yang bisa diunduh (artifact).
# HANYA berjalan kalau dijalankan manual dari tab Actions. Setelah file cadangan diunduh:
#   1) hapus artifact-nya di halaman run, 2) hapus file workflow ini dari repo.
name: Ambil cadangan kunci APK (sekali pakai)

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-24.04
    steps:
      - name: Susun file cadangan dari secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 tidak ada di repo ini. Kunci rilis memang belum pernah dipasang di sini."
            exit 1
          fi
          mkdir -p cadangan
          echo "$KEYSTORE_BASE64" | base64 -d > cadangan/release.jks
          printf '%s' "$KEYSTORE_BASE64" > cadangan/KEYSTORE_BASE64.txt
          {
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } > cadangan/password.txt
          echo "Cadangan siap. Ukuran keystore: $(wc -c < cadangan/release.jks) byte"

      - name: Unggah sebagai artifact (berlaku 1 hari)
        uses: actions/upload-artifact@v4
        with:
          name: CADANGAN-KUNCI-APK-RAHASIA
          path: cadangan/
          retention-days: 1
