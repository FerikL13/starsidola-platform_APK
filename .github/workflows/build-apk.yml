name: Build STARS IDOLA Global APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Runner GitHub sudah membawa Android SDK (ANDROID_HOME). Tidak perlu unduh ulang command-line tools
      # (langkah setup-android sebelumnya gagal saat "Fetch remote repository"), cukup terima lisensi.
      - name: Terima lisensi Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Cari folder proyek otomatis (tahan kalau file terunggah ke dalam subfolder).
      - name: Cari folder proyek Android
        id: proj
        run: |
          F=$(find . -maxdepth 4 -name settings.gradle -not -path "*/node_modules/*" -not -path "./.git/*" | head -1)
          if [ -z "$F" ]; then
            echo "::error::settings.gradle tidak ditemukan di repo. Isi repo:"
            find . -maxdepth 3 -not -path "./.git/*" | head -60
            exit 1
          fi
          D=$(dirname "$F")
          echo "Folder proyek: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - name: Siapkan kunci rilis (kalau secret tersedia)
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 belum diisi, build memakai tanda tangan debug."
          fi

      - name: Build APK rilis
        if: steps.ks.outputs.mode == 'release'
        env:
          KEYSTORE_PATH: ${{ steps.ks.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleRelease

      - name: Build APK debug (fallback)
        if: steps.ks.outputs.mode == 'debug'
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug

      - name: Ganti nama APK
        run: |
          mkdir -p out
          P="${{ steps.proj.outputs.dir }}"
          if [ "${{ steps.ks.outputs.mode }}" = "release" ]; then
            cp "$P/app/build/outputs/apk/release/app-release.apk" out/stars-idola.apk
          else
            cp "$P/app/build/outputs/apk/debug/app-debug.apk" out/stars-idola.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stars-idola-apk-${{ steps.ks.outputs.mode }}
          path: out/stars-idola.apk
