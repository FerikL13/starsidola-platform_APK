name: Build STARS IDOLA APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip source-apk.zip
        run: |
          rm -rf apk-src
          mkdir -p apk-src
          unzip -q source-apk.zip -d apk-src
          echo "ZIP extracted"
          find apk-src -maxdepth 3 -type f | head -80

      - name: Find Android project root
        id: root
        run: |
          ROOT=$(find apk-src -name "settings.gradle" -o -name "settings.gradle.kts" | head -1 | xargs -r dirname)
          if [ -z "$ROOT" ]; then
            ROOT=$(find apk-src -name "build.gradle" -o -name "build.gradle.kts" | head -1 | xargs -r dirname)
          fi
          if [ -z "$ROOT" ]; then
            echo "Android project root not found"
            exit 1
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $ROOT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: |
          cd "${{ steps.root.outputs.root }}"
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: Build Debug APK
        run: |
          cd "${{ steps.root.outputs.root }}"
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: STARS_IDOLA_APK_DEBUG
          path: ${{ steps.root.outputs.root }}/app/build/outputs/apk/debug/*.apk
