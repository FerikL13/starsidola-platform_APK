name: Build STARS IDOLA Global Release APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Unzip dan Pindahkan File ke Root
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Menemukan ZIP: $ZIP_FILE. Meng-ekstrak..."
            unzip -o "$ZIP_FILE"
          else
            echo "ERROR: Tidak ada file .zip di root repository!"
            ls -la
            exit 1
          fi

          if [ ! -f "gradlew" ]; then
            GRADLEW_PATH=$(find . -mindepth 2 -name "gradlew" | head -n 1)
            if [ -n "$GRADLEW_PATH" ]; then
              SUBDIR=$(dirname "$GRADLEW_PATH")
              echo "File gradlew ditemukan di $SUBDIR, memindahkan ke root..."
              shopt -s dotglob
              mv "$SUBDIR"/* .
            fi
          fi

          if [ ! -f "gradlew" ]; then
            echo "ERROR: File gradlew tetap tidak ditemukan!"
            ls -la
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Sign Release APK
        run: |
          keytool -genkey -v -keystore release.keystore -alias starsidola -keyalg RSA -keysize 2048 -validity 10000 -storepass starsidola123 -keypass starsidola123 -dname "CN=Stars Idola, OU=App, O=Stars Idola, L=Jakarta, C=ID"
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:starsidola123 --ks-key-alias starsidola "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: STARS_IDOLA_RELEASE_SIGNED
          path: app/build/outputs/apk/release/*.apk
