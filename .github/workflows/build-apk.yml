name: Build STARS IDOLA Global APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Siapkan kunci rilis (kalau secret tersedia)
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 belum diisi, build memakai tanda tangan debug."
          fi

      - name: Build APK rilis
        if: steps.ks.outputs.mode == 'release'
        env:
          KEYSTORE_PATH: ${{ steps.ks.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Build APK debug (fallback)
        if: steps.ks.outputs.mode == 'debug'
        run: gradle assembleDebug

      - name: Ganti nama APK
        run: |
          mkdir -p out
          if [ "${{ steps.ks.outputs.mode }}" = "release" ]; then
            cp app/build/outputs/apk/release/app-release.apk out/stars-idola.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk out/stars-idola.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stars-idola-apk-${{ steps.ks.outputs.mode }}
          path: out/stars-idola.apk
