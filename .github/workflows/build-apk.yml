name: Build STARS IDOLA Global Release APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

            - name: Unzip source code
        run: |
          if [ -f "source-apk.zip" ]; then
            echo "Memproses source-apk.zip..."
            unzip -o source-apk.zip
          else
            echo "ERROR: File source-apk.zip tidak ditemukan di root repository!"
            ls -la
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Sign Release APK
        run: |
          keytool -genkey -v -keystore release.keystore -alias starsidola -keyalg RSA -keysize 2048 -validity 10000 -storepass starsidola123 -keypass starsidola123 -dname "CN=Stars Idola, OU=App, O=Stars Idola, L=Jakarta, C=ID"
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:starsidola123 --ks-key-alias starsidola "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: STARS_IDOLA_RELEASE_SIGNED
          path: app/build/outputs/apk/release/*.apk
